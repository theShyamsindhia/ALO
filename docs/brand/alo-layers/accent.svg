<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1254" height="1254" viewBox="0 0 1254 1254">
<title>ALO — accent</title>
<desc>Editable vector reconstruction of the approved blue and coral render; not the pixel-exact master.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2=".5" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#229aff"/><stop offset=".45" stop-color="#306aff"/><stop offset="1" stop-color="#3622ce"/></linearGradient>
  <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff8580"/><stop offset=".55" stop-color="#ff6976"/><stop offset="1" stop-color="#d73c64"/></linearGradient>
  <linearGradient id="pearl" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#dedfff"/><stop offset=".48" stop-color="#faf7fa"/><stop offset="1" stop-color="#fce5e6"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="13" flood-opacity=".2"/></filter>
  <filter id="letterShadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#251963" flood-opacity=".25"/></filter>
</defs>
<g id="accent" inkscape:groupmode="layer" inkscape:label="02 Coral terminal"><path d="M 891,701 C 957,702 1008,657 1024,594" fill="none" stroke="url(#coral)" stroke-width="46" stroke-linecap="round" filter="url(#letterShadow)"/></g>
</svg>

