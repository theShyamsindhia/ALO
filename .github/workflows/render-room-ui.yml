name: Render native room UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ALO_UI_RENDER_DIR: ${{ runner.temp }}/alo-ui-renders
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/swift-build-cache
        with:
          flavor: tests
      - name: Render offline views from production components
        run: >-
          swift test -c release --no-parallel --filter RoomUIRenderTests
          -Xswiftc -Xllvm -Xswiftc -sil-disable-pass=CapturePropagation
          -Xswiftc -Xllvm -Xswiftc -sil-disable-pass-only-function=main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alo-ui-renders
          path: ${{ runner.temp }}/alo-ui-renders
          if-no-files-found: error
