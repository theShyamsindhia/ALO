name: Verify Mac tests and iOS app

on:
  pull_request:
  push:
    branches: [main, codex/full-nearby-integration]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify pinned toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"
      - uses: ./.github/actions/swift-build-cache
        with:
          flavor: tests
      - name: Compile all optimized tests
        run: |
          swift build -c release --build-tests \
            -Xswiftc -Xllvm -Xswiftc -sil-disable-pass=CapturePropagation \
            -Xswiftc -Xllvm -Xswiftc -sil-disable-pass-only-function=main
      - uses: ./.github/actions/swift-build-cache
        with:
          flavor: tests
          mode: save
      - name: Run tests without installing or signing an app
        # Same optimized test-only entrypoint workaround and strict live timing
        # gates as the release workflow; packaging flags remain unchanged.
        run: |
          set -euo pipefail
          swift test -c release --skip-build --no-parallel \
            -Xswiftc -Xllvm -Xswiftc -sil-disable-pass=CapturePropagation \
            -Xswiftc -Xllvm -Xswiftc -sil-disable-pass-only-function=main \
            2>&1 | tee "$RUNNER_TEMP/alo-tests.log"
          grep -Eq 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites)? passed' "$RUNNER_TEMP/alo-tests.log"
      - name: Run repeatable room scenarios
        run: bash Scripts/test_room_scenarios.sh
      - name: Show XCTest crash reports on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          directory = Path.home() / "Library/Logs/DiagnosticReports"
          reports = sorted(
              [path for path in directory.glob("*")
               if path.is_file() and path.name.startswith(("ALOPackageTests", "xctest"))
               and path.suffix in (".ips", ".crash")],
              key=lambda path: path.stat().st_mtime,
          )[-3:]
          if not reports:
              print("No XCTest crash report was produced by this runner.")
          for report in reports:
              print(f"\nXCTest crash report: {report.name}\n")
              print(report.read_text(errors="replace")[:100_000])
          PY

  mac-app-build:
    # Seed the default-branch app cache for release tags. Tag-local caches are
    # not visible to subsequent tags, so release-only caching would stay cold.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/swift-build-cache
        with:
          flavor: app
      - name: Build distribution code without installing or signing
        run: swift build -c release --arch arm64
      - uses: ./.github/actions/swift-build-cache
        with:
          flavor: app
          mode: save

  ios-app-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Link the iOS app and shared libraries without signing
        run: >-
          xcodebuild -project iOS/ALO.xcodeproj -scheme ALO
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/alo-ios-app"
          CODE_SIGNING_ALLOWED=NO build
