name: Build Apple Silicon app

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      - name: Verify signing identity
        env:
          WERAI_CODESIGN_IDENTITY: ${{ vars.WERAI_CODESIGN_IDENTITY }}
        run: |
          test -n "$WERAI_CODESIGN_IDENTITY"
          security find-identity -v -p codesigning | grep -F "$WERAI_CODESIGN_IDENTITY"

      - name: Build and package arm64 app
        env:
          WERAI_CODESIGN_IDENTITY: ${{ vars.WERAI_CODESIGN_IDENTITY }}
        run: ./Scripts/package.sh --arm64-only

      - name: Notarize and staple app and disk image
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          WERAI_CODESIGN_IDENTITY: ${{ vars.WERAI_CODESIGN_IDENTITY }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          api_key_path="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          trap 'rm -f "$api_key_path"' EXIT
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | /usr/bin/base64 -D > "$api_key_path"

          xcrun notarytool submit dist/WERAI-macos-arm64.zip \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --timeout 15m
          xcrun stapler staple dist/WERAI.app
          ./Scripts/create_distribution_archives.sh arm64
          codesign --force --timestamp --sign "$WERAI_CODESIGN_IDENTITY" \
            dist/WERAI-macos-arm64.dmg

          xcrun notarytool submit dist/WERAI-macos-arm64.dmg \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --timeout 15m
          xcrun stapler staple dist/WERAI-macos-arm64.dmg

      - name: Verify architecture, signature, and Gatekeeper acceptance
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID"
          file dist/WERAI.app/Contents/MacOS/werai
          lipo dist/WERAI.app/Contents/MacOS/werai -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 dist/WERAI.app
          signature="$(codesign -dvvv dist/WERAI.app 2>&1)"
          grep -F "Authority=Developer ID Application:" <<< "$signature"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"
          codesign --verify --strict --verbose=2 dist/WERAI-macos-arm64.dmg
          xcrun stapler validate dist/WERAI.app
          xcrun stapler validate dist/WERAI-macos-arm64.dmg
          spctl --assess --type execute --verbose=4 dist/WERAI.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: WERAI-macos-arm64
          path: |
            dist/WERAI-macos-arm64.zip
            dist/WERAI-macos-arm64.dmg
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified app
        uses: actions/download-artifact@v4
        with:
          name: WERAI-macos-arm64
          path: dist

      - name: Attach app to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/WERAI-macos-arm64.zip \
            dist/WERAI-macos-arm64.dmg \
            --clobber
