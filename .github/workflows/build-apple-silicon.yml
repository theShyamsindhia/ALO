name: Build Apple Silicon app

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install Developer ID certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      - name: Verify signing identity
        env:
          WERAI_CODESIGN_IDENTITY: ${{ vars.WERAI_CODESIGN_IDENTITY }}
        run: |
          test -n "$WERAI_CODESIGN_IDENTITY"
          security find-identity -v -p codesigning | grep -F "$WERAI_CODESIGN_IDENTITY"

      - name: Build and package arm64 app
        env:
          WERAI_CODESIGN_IDENTITY: ${{ vars.WERAI_CODESIGN_IDENTITY }}
        run: ./Scripts/package.sh --arm64-only

      - name: Verify app architecture and Developer ID signature
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID"
          file dist/WERAI.app/Contents/MacOS/werai
          lipo dist/WERAI.app/Contents/MacOS/werai -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 dist/WERAI.app
          signature="$(codesign -dvvv dist/WERAI.app 2>&1)"
          grep -F "Authority=Developer ID Application:" <<< "$signature"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: WERAI-macos-arm64
          path: dist/WERAI-macos-arm64.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified app
        uses: actions/download-artifact@v4
        with:
          name: WERAI-macos-arm64
          path: dist

      - name: Attach app to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/WERAI-macos-arm64.zip --clobber
