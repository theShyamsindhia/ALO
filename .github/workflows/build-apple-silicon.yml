name: Build Apple Silicon app

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Build and package arm64 app
        run: ./Scripts/package.sh --arm64-only

      - name: Verify app architecture
        run: |
          file dist/WERAI.app/Contents/MacOS/werai
          lipo dist/WERAI.app/Contents/MacOS/werai -verify_arch arm64

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: WERAI-macos-arm64
          path: dist/WERAI-macos-arm64.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified app
        uses: actions/download-artifact@v4
        with:
          name: WERAI-macos-arm64
          path: dist

      - name: Attach app to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/WERAI-macos-arm64.zip --clobber
